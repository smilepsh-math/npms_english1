<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 영어 구술평가 문법 점검기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        h1 { font-size: 22px; color: #333; text-align: center; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; resize: vertical; box-sizing: border-box; }
        button { width: 100%; background-color: #4CAF50; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #45a049; }
        
        /* 결과 출력 박스 스타일 */
        .result-box { margin-top: 25px; padding: 20px; background-color: #f9f9f9; border-radius: 8px; border-left: 5px solid #4CAF50; display: none; }
        .section-item { margin-bottom: 18px; }
        .section-item:last-child { margin-bottom: 0; }
        .result-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .result-content { font-size: 15px; line-height: 1.6; color: #2c3e50; background: white; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        
        .loading { text-align: center; display: none; margin-top: 15px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏫 영어 구술평가 영작문 점검기</h1>
    <p style="font-size: 14px; color: #666;">작성한 영어 문장을 입력하고 점검 버튼을 누르세요.</p>
    
    <textarea id="englishInput" placeholder="예: Be on time is very important."></textarea>
    <button onclick="checkGrammar()">AI 문법 점검하기</button>

    <div class="loading" id="loading">선생님 AI가 문장을 점검하는 중입니다... ⏳</div>

    <div class="result-box" id="resultBox">
        <!-- ① 수정된 전체 문장 -->
        <div class="section-item">
            <div class="result-title" style="color: #2e7d32;">✨ ① 수정된 문장</div>
            <div class="result-content" id="correctedText"></div>
        </div>

        <!-- ② 반드시 고쳐야 할 문법 오류 -->
        <div class="section-item">
            <div class="result-title" style="color: #c62828;">🚨 ② 반드시 고쳐야 할 문법 오류</div>
            <div class="result-content" id="errorsText"></div>
        </div>

        <!-- ③ 더 자연스러운 표현 제안 -->
        <div class="section-item" id="suggestionSection">
            <div class="result-title" style="color: #0277bd;">💡 ③ 더 자연스러운 표현 제안</div>
            <div class="result-content" id="suggestionText"></div>
        </div>

        <!-- ④ 선생님의 격려 한마디 -->
        <div class="section-item">
            <div class="result-title" style="color: #ef6c00;">💌 ④ 선생님의 한 줄 응원</div>
            <div class="result-content" id="encouragementText" style="background-color: #fffde7;"></div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AQ.Ab8RN6I3wB5QWoogTI2U-tKTVGdeDZuNsV6ru2VnvDUl0KnZpA";

    async function checkGrammar() {
        const text = document.getElementById("englishInput").value.trim();
        if (!text) {
            alert("영문장을 입력해주세요!");
            return;
        }

        document.getElementById("loading").style.display = "block";
        document.getElementById("resultBox").style.display = "none";

        const systemPrompt = `너는 중학교 영어교사의 영작 첨삭 도우미야.
학생이 작성한 영어 문장을 다음 원칙에 따라 점검해 줘.

[점검 원칙]
1. 학생의 원래 문장 구조와 어휘를 최대한 유지해.
2. 문법적으로 명확하게 틀린 부분만 수정해.
3. 문법 오류와 더 자연스러운 표현 제안을 반드시 구분해.
4. 오류를 설명할 때는 중학생이 이해할 수 있는 쉬운 한국어를 사용해.
5. 문법 오류가 없는 문장은 억지로 수정하지 마. 오류가 없다면 "문법 오류가 없어요!"라고 안내해.
6. 문법적으로 허용되는 표현은 학생의 원문을 존중해.
7. 전체 문장을 새로 작성하거나 학생 수준보다 어려운 표현으로 바꾸지 마.
8. 대명사(he, she, it, they, him, her, them 등)의 지시 대상이나 학생의 의도를 임의로 변경하지 마. 문맥상 가능한 표현이라면 학생의 원문을 존중해.
9. 더 자연스러운 표현은 의미가 불분명하거나 명백히 어색한 경우에만 제안해. 개선할 필요가 없다면 "현재 문장도 충분히 자연스러워요!"라고 안내해. 

[응답 형식]
반드시 다음 JSON 형식으로만 응답해야 해:
{
  "corrected": "수정된 전체 문장 (오류가 없으면 학생의 원래 문장)",
  "errors": "반드시 고쳐야 할 문법 오류와 간단한 설명 (오류가 없다면 '문법 오류가 없어요!')",
  "suggestions": "더 자연스러운 표현 제안 (없다면 '없음')",
  "encouragement": "학생에게 주는 따뜻하고 짧은 격려 한마디"
}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: `${systemPrompt}\n\n[학생 입력 문장]\n${text}` }]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "API 연결 실패");
            }

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(rawText);

            // ① 수정된 문장
            document.getElementById("correctedText").innerText = result.corrected;
            
            // ② 문법 오류 설명
            document.getElementById("errorsText").innerText = result.errors;
            
            // ③ 더 자연스러운 표현 제안 (없음인 경우 숨기거나 표시)
            if (result.suggestions && result.suggestions !== "없음") {
                document.getElementById("suggestionSection").style.display = "block";
                document.getElementById("suggestionText").innerText = result.suggestions;
            } else {
                document.getElementById("suggestionSection").style.display = "none";
            }

            // ④ 격려 한마디
            document.getElementById("encouragementText").innerText = result.encouragement;

            document.getElementById("resultBox").style.display = "block";
        } catch (error) {
            console.error(error);
            alert("오류 원인: " + error.message);
        } finally {
            document.getElementById("loading").style.display = "none";
        }
    }
</script>

</body>
</html>
